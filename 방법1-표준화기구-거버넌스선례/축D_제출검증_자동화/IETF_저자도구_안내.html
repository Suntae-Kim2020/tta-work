elcome to the Internet-Draft authors resource site</h1>
<p>This site is the central resource site for authors of an Internet-Draft (I-D), with information on how to write an I-D and the tools available to support this. If you are new to authoring then begin with the introduction below or if you are more familiar then the main menu lists multiple individual topics.</p>
<h1 class="toc-header" id="introducing-internet-drafts"><a href="#introducing-internet-drafts" class="toc-anchor">¶</a> Introducing Internet-Drafts</h1>
<p>Internet-Drafts (I-Ds) are the basic work items of the IETF and they are produced for a variety of purposes by a wide range of individuals and groups. Anyone can write and submit an Internet-Draft.</p>
<p>Some I-Ds may eventually be published as a Request for Comment (RFC).  Each of the <a class="is-external-link" href="https://rfc-editor.org/info/rfc8729">RFC Streams</a> has their own process for how an I-D becomes an RFC.  For the IETF that is documented in the <a class="is-external-link" href="https://www.ietf.org/standards/process/">standards development process</a>.  When an I-D is approved to become an RFC, it follows the separate RFC Editor <a class="is-internal-link is-valid-page" href="/rfc-publication-process">RFC publication process</a>.</p>
<p>Unless otherwise indicated, the information on this site applies to all streams.</p>
<p>Internet-Drafts are prepared by people acting in possibly several roles, such as an author or an editor. The term "author" is used here, but the information applies to people acting in any role.</p>
<p><strong>To find out more about authoring an I-D, begin with <a class="is-internal-link is-valid-page" href="/getting-started">Getting started</a>.</strong></p>
<h1 class="toc-header" id="contributing-to-this-site"><a href="#contributing-to-this-site" class="toc-anchor">¶</a> Contributing to this site</h1>
<p>The content for this site is available in <a class="is-external-link" href="https://github.com/ietf/authors.ietf.org">GitHub</a> and we welcome pull requests proposing changes from the community. The repository <a class="is-external-link" href="https://github.com/ietf-authors/authors.ietf.org/blob/main/README.md">README</a> provides guidance on how to submit pull requests.</p>
<p>Likewise, the <a class="is-internal-link is-valid-page" href="/templates-and-schemas">templates and schemas</a> available on this site are published on <a class="is-external-link" href="https://github.com/ietf-authors/rfcxml-templates-and-schemas">GitHub</a> and we welcome pull requests proposing changes.</p>
<h1 class="toc-header" id="acknowledgements"><a href="#acknowledgements" class="toc-anchor">¶</a> Acknowledgements</h1>
<p>This site includes much text from previous work by Henrik Levkowetz, Robert Sparks, Russ Housley, Ben Kaduk, Murray Kucherawy, Alvaro Retana, the RFC Production Center, and the members of many Internet Engineering Steering Groups (<a class="is-external-link" href="https://www.ietf.org/iesg/">IESGs</a>).</p>
<h1 class="toc-header" id="activity-tracking"><a href="#activity-tracking" class="toc-anchor">¶</a> Activity tracking</h1>
<p>Activity on this site is tracked in accordance with the <a class="is-external-link" href="https://www.ietf.org/privacy-statement/">IETF/IRTF/IAB Privacy Statement</a></p>
